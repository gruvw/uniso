<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Uniso Scales</title>

  <style>
    :root {
      --bottom-color: white;
      --top-color: black;
      --highlight-color: grey;
      --scale-color: #0ea5e9;
      --scale-root-color: #f59e0b;
    }

    * {
      margin: 0;
      padding: 0;
    }

    .uniso-container {
      display: flex;
      margin: 16px;
    }

    .note {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;

      padding-bottom: 16px;

      font-family: "Arial";
      font-weight: bold;
      font-size: 12px;

      border: 2px solid black;
      background-color: var(--bg-color);

      position: relative;
      overflow: hidden;
    }

    .note::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background-color: transparent;
      transition: background-color 0.2s ease;
    }

    .note.scale::after {
      background-color: var(--scale-color);
    }

    .note.scale-root::after {
      background-color: var(--scale-root-color);
    }

    .note.bottom {
      width: 48px;
      height: 150px;
      background-color: var(--bottom-color);
    }

    .note.top {
      width: 24px;
      height: 100px;
      background-color: var(--top-color);
      color: white;

      margin-left: -14px;
      margin-right: -16px;
      transform: translateX(-1px);

      z-index: 1;
    }

    .note.highlight {
      background-color: var(--highlight-color);
      color: white;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      flex-wrap: wrap;
    }
    .controls label {
      font-size: 13px;
      margin-right: 4px;
    }
  </style>
</head>

<body>
  <div class="uniso-container" id="keyboard"></div>

  <div class="controls">
    <div>
      <label for="root-select">Root</label>
      <select id="root-select"></select>
    </div>
    <div>
      <label for="scale-select">Scale</label>
      <select id="scale-select">
        <option value="none">None</option>
        <option value="major">Major</option>
        <option value="minor">Minor</option>
      </select>
    </div>
  </div>

  <script>
    const NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
    const OCTAVES = 2;

    const SCALE_INTERVALS = {
      major: [0,2,4,5,7,9,11],
      minor: [0,2,3,5,7,8,10],
      none: []
    };

    const container = document.getElementById("keyboard");
    const rootSelect = document.getElementById("root-select");

    function buildKeyboard() {
      rootSelect.innerHTML = "";
      NAMES.forEach(noteName => {
        const option = document.createElement("option");
        option.value = noteName;
        option.textContent = noteName;
        rootSelect.appendChild(option);
      });

      container.innerHTML = "";
      for (let o = 0; o < OCTAVES; o++) {
        for (let i = 0; i < NAMES.length / 2; i++) {
          const bottom = document.createElement("span");
          bottom.className = "note bottom" + (i == 0 ? " highlight" : "");
          bottom.textContent = NAMES[2*i];
          bottom.dataset.note = NAMES[2*i];

          const top = document.createElement("span");
          top.className = "note top" + (i == 2 ? " highlight" : "");
          top.textContent = NAMES[2*i+1];
          top.dataset.note = NAMES[2*i+1];

          container.appendChild(bottom);
          container.appendChild(top);
        }
      }
    }

    function applyClasses() {
      const root = document.getElementById("root-select").value;
      const scaleType = document.getElementById("scale-select").value;
      const rootIdx = NAMES.indexOf(root);
      const intervals = SCALE_INTERVALS[scaleType];
      const scaleSet = new Set(intervals.map(i => (rootIdx + i) % 12));

      const notes = container.querySelectorAll(".note");
      notes.forEach((n, i) => {
        const noteIndex = i % NAMES.length;
        const noteNameIndex = NAMES.indexOf(n.dataset.note);

        n.classList.remove("scale", "scale-root");

        if (scaleType !== "none") {
          if (noteNameIndex === rootIdx) {
            n.classList.add("scale-root");
          } else if (scaleSet.has(noteNameIndex)) {
            n.classList.add("scale");
          }
        }
      });
    }

    buildKeyboard();
    applyClasses();

    document.getElementById("root-select").addEventListener("change", applyClasses);
    document.getElementById("scale-select").addEventListener("change", applyClasses);
  </script>
</body>

</html>
